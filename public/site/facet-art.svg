<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice">
  <!-- Facet band artwork, palette matched to the sampled Slalom wave asset:
       ground #000A25 stays the dark; planes are saturated DEEP blues
       (composites in the #0B1A40-#00194D family), never pale washes and
       never added black. Vertices off-canvas; soft painted edges. -->
  <defs>
    <linearGradient id="lt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D6BE0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#3D6BE0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lt2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0E3EA8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0E3EA8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000314" stop-opacity=".38"/>
      <stop offset="1" stop-color="#000314" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <g filter="url(#soft)">
    <polygon points="-200,-300 1640,-300 1640,240 -200,560" fill="url(#lt1)"/>
    <polygon points="-200,940 -200,430 1640,20 1640,420 -200,860" fill="url(#lt2)" opacity=".8"/>
    <polygon points="-200,940 760,940 -200,560" fill="url(#sh)"/>
  </g>
  <ellipse cx="-60" cy="-100" rx="640" ry="420" fill="#2E5AC7" opacity=".26" filter="url(#softer)"/>
</svg>
