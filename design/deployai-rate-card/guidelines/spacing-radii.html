<!-- @dsCard group="Spacing" viewport="700x230" name="Radii & borders" subtitle="50px pills, 30px panels, hairlines, dashed blueprint blocks" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--sans);color:var(--ink)}.sw{display:flex;height:150px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;font-size:12px;font-weight:700}.sw small{font-weight:400;opacity:.75;font-size:11px}</style></head><body><div style="display:flex;gap:16px;padding:22px 24px;align-items:flex-start">
<div style="text-align:center"><span class="pill p-blue" style="pointer-events:none">Pill · 50px</span></div>
<div style="width:130px;height:110px;background:var(--field);border-radius:30px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:700;box-sizing:border-box">panel · 30px</div>
<div style="width:130px;height:110px;background:var(--field);border-radius:16px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:700;box-sizing:border-box">rail · 16px</div>
<div style="width:150px;height:110px;border:1.5px dashed var(--blue);border-radius:2px;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:700;color:var(--blue);box-sizing:border-box">blueprint · dashed</div>
<div style="width:130px;height:110px;border-top:1px solid #ccc;padding:10px 0;font-size:11px;color:var(--grey);box-sizing:border-box">hairline rule #ccc / rgba(0,10,37,.5)</div>
</div></body></html>
