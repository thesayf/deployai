<!-- @dsCard group="Colors" viewport="700x180" name="Ground rhythm" subtitle="white → field → navy → royal/statnavy → coral; lime is a thread, never a ground" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--sans);color:var(--ink)}.sw{display:flex;height:150px}.sw>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px;font-size:12px;font-weight:700}.sw small{font-weight:400;opacity:.75;font-size:11px}</style></head><body><div style="display:flex;height:120px">
<div style="flex:1;background:#fff;border:1px solid #eee"></div>
<div style="flex:1;background:var(--field)"></div>
<div style="flex:1;background:var(--navy)"></div>
<div style="flex:1;background:var(--royal)"></div>
<div style="flex:1;background:#020A23;border-bottom:6px solid var(--lime)"></div>
<div style="flex:1;background:var(--coral)"></div>
</div>
<div style="padding:12px 14px;font-size:12px;line-height:1.5">Dark bands never sit adjacent — a lighter band cleanses between. Coral appears once per page.</div></body></html>
