<!-- @dsCard group="Marketing Site" viewport="1440x860" name="Marketing site" subtitle="Home + Services — interactive recreation of deployai.studio" -->
<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>deployai.studio — marketing site UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}.kit-switch{position:fixed;bottom:18px;right:18px;z-index:99;display:flex;gap:4px;background:var(--field);border-radius:32px;padding:6px;box-shadow:0 8px 30px rgba(0,10,37,.25)}.kit-switch button{border:none;background:none;border-radius:32px;padding:8px 18px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}.kit-switch button.on{background:var(--blue);color:#fff}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem("deployai-kit-screen") || "home");
  const nav = (s) => { setScreen(s); localStorage.setItem("deployai-kit-screen", s); window.scrollTo(0, 0); };
  const Home = window.MarketingHome, Services = window.MarketingServices;
  return (
    <div>
      {screen === "home" ? <Home nav={nav} /> : <Services nav={nav} />}
      <div className="kit-switch">
        <button className={screen === "home" ? "on" : ""} onClick={() => nav("home")}>Home</button>
        <button className={screen === "services" ? "on" : ""} onClick={() => nav("services")}>Services</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
